services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: meditrace
      POSTGRES_USER: meditrace
      POSTGRES_PASSWORD: meditrace-dev
    ports:
      - "5432:5432"
    volumes:
      - meditrace-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meditrace"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  meditrace-postgres:
